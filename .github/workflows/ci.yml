name: CI

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  quality:
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Lint
        run: python -m flake8 manage.py oc_lettings_site lettings profiles docker --statistics --count
      - name: Lint data migrations
        run: python -m flake8 --exclude='' lettings/migrations/0002_copy_lettings_data.py profiles/migrations/0002_copy_profiles_data.py --statistics --count
      - name: Tests and coverage
        run: python -m pytest --cov
